<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Secure Payment | EverlyPups</title>
  <script src="data/siteData.js?v=1719"></script>
  <script>
    const FLUTTERWAVE_PAYMENT_LINK = 'https://flutterwave.com/pay/bk6gibj80y8i';

    document.addEventListener('DOMContentLoaded', async () => {
      const customer = JSON.parse(localStorage.getItem('everlypups_checkout_details') || '{}');
      const delivery = JSON.parse(localStorage.getItem('everlypups_checkout_delivery') || '{}');

      // Asynchronously send order notification email to info@everlypups.com
      const payload = {
        customer: customer,
        delivery: delivery,
        paymentMethod: 'Flutterwave Direct Payment Link'
      };

      try {
        await fetch('process-payment.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error('Error sending order notification:', e);
      }

      // Redirect immediately to Flutterwave Payment Link
      window.location.href = FLUTTERWAVE_PAYMENT_LINK;
    });
  </script>
</head>
<body style="font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #F8FAFC; color: #1E293B;">
  <div style="text-align: center; padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); max-width: 400px; width: 90%;">
    <h2 style="margin-top: 0; color: #00B67A;">Connecting to Secure Payment...</h2>
    <p style="color: #64748B; font-size: 0.95rem; line-height: 1.5;">Please wait while we redirect you to your official Flutterwave checkout page.</p>
    <div style="margin-top: 1.5rem;">
      <a href="https://flutterwave.com/pay/bk6gibj80y8i" style="color: #00B67A; font-weight: bold; text-decoration: none;">Click here if you are not redirected automatically</a>
    </div>
  </div>
</body>
</html>
